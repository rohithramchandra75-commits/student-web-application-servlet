<section>

    <form class="form-box" action="login" method="post">

        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button type="submit">Login</button>

    </form>

</section>

<footer>
    <h3>Student Productivity Portal</h3>
</footer>
